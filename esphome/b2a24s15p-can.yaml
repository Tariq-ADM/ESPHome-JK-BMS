# Draft. Not flashed on a B2A24S15P-CAN.
#
# Listens to the published BMS-CAN instrument protocol:
# CAN 2.0A, 250 kbit/s, standard IDs, BMS address 0xF4.
#   0x02F4 pack status every 20 ms
#   0x04F4 min/max cell every 100 ms
#   0x05F4 temperatures every 100 ms
#   0x07F4 alarms while an alarm is active
#
# This protocol does not carry all 24 cell voltages. Use the UART or BLE
# draft for a per-cell reading. Positive current in this file is discharge.
#
# If the log shows IDs such as 0x351/0x355/0x356, the port is in an inverter
# profile. Flash esphome/b2a24s15p-can-pylon.yaml instead, at 500 kbit/s.
#
# Wiring is docs/figures/can-wiring.svg. Transceiver is an SN65HVD230 on 3V3.
# Do not connect VGPS to the ESP.

substitutions:
  name: b2a24s15p-can
  tx_pin: GPIO5
  rx_pin: GPIO4

esphome:
  name: ${name}
  friendly_name: B2A24S15P CAN
  min_version: "2026.1.0"
  comment: "Draft listener for JK-B2A24S15P-CAN, instrument protocol"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: template
    name: Pack voltage
    id: pack_voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
  - platform: template
    name: Pack current
    id: pack_current
    unit_of_measurement: A
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
  - platform: template
    name: Pack power
    id: pack_power
    unit_of_measurement: W
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
  - platform: template
    name: State of charge
    id: state_of_charge
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
  - platform: template
    name: Discharge time
    id: discharge_time
    unit_of_measurement: h
    accuracy_decimals: 0
  - platform: template
    name: Max cell voltage
    id: max_cell_voltage
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
  - platform: template
    name: Max cell
    id: max_cell
    accuracy_decimals: 0
  - platform: template
    name: Min cell voltage
    id: min_cell_voltage
    unit_of_measurement: V
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
  - platform: template
    name: Min cell
    id: min_cell
    accuracy_decimals: 0
  - platform: template
    name: Max temperature
    id: max_temperature
    unit_of_measurement: °C
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
  - platform: template
    name: Min temperature
    id: min_temperature
    unit_of_measurement: °C
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
  - platform: template
    name: Average temperature
    id: average_temperature
    unit_of_measurement: °C
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement

binary_sensor:
  - platform: template
    name: Alarm active
    id: alarm_active
    device_class: problem

text_sensor:
  - platform: template
    name: Alarms
    id: alarms

canbus:
  - platform: esp32_can
    id: bms_can
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    bit_rate: 250KBPS
    can_id: 0x700
    on_frame:
      - can_id: 0x02F4
        then:
          - lambda: |-
              if (x.size() < 8) return;
              uint16_t raw_v = (uint16_t) x[0] | ((uint16_t) x[1] << 8);
              uint16_t raw_i = (uint16_t) x[2] | ((uint16_t) x[3] << 8);
              uint16_t hours = (uint16_t) x[6] | ((uint16_t) x[7] << 8);
              float volts = raw_v * 0.1f;
              float amps = raw_i * 0.1f - 400.0f;
              id(pack_voltage).publish_state(volts);
              id(pack_current).publish_state(amps);
              id(pack_power).publish_state(volts * amps);
              id(state_of_charge).publish_state(x[4]);
              id(discharge_time).publish_state(hours);
      - can_id: 0x04F4
        then:
          - lambda: |-
              if (x.size() < 6) return;
              // Example 8C 0A 05 92 09 08: min voltage is bytes 3-4, min cell is byte 5.
              uint16_t max_mv = (uint16_t) x[0] | ((uint16_t) x[1] << 8);
              uint16_t min_mv = (uint16_t) x[3] | ((uint16_t) x[4] << 8);
              id(max_cell_voltage).publish_state(max_mv / 1000.0f);
              id(max_cell).publish_state(x[2]);
              id(min_cell_voltage).publish_state(min_mv / 1000.0f);
              id(min_cell).publish_state(x[5]);
      - can_id: 0x05F4
        then:
          - lambda: |-
              if (x.size() < 5) return;
              id(max_temperature).publish_state(x[0] - 50);
              id(min_temperature).publish_state(x[2] - 50);
              id(average_temperature).publish_state(x[4] - 50);
      - can_id: 0x07F4
        then:
          - lambda: |-
              if (x.size() < 4) return;
              static const char *names[] = {
                "cell_overvoltage", "cell_undervoltage",
                "pack_overvoltage", "pack_undervoltage",
                "cell_delta", "discharge_overcurrent", "charge_overcurrent",
                "temperature_high", "temperature_low", "temperature_delta",
                "soc_low", "insulation_low", "hv_interlock",
                "external_comms", "internal_comms"
              };
              uint32_t bits = (uint32_t) x[0] | ((uint32_t) x[1] << 8) |
                              ((uint32_t) x[2] << 16) | ((uint32_t) x[3] << 24);
              std::string msg;
              for (int i = 0; i < 15; i++) {
                uint8_t level = (bits >> (2 * i)) & 0x3;
                if (level == 0) continue;
                if (!msg.empty()) msg += ", ";
                msg += names[i];
                msg += ":L";
                msg += char('0' + level);
              }
              if (msg.empty()) msg = "none";
              id(alarms).publish_state(msg);
              id(alarm_active).publish_state(msg != "none");
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              if (can_id == 0x02F4 || can_id == 0x04F4 || can_id == 0x05F4 || can_id == 0x07F4)
                return;
              ESP_LOGW("jk_can", "other id=0x%03X dlc=%u", can_id, x.size());
