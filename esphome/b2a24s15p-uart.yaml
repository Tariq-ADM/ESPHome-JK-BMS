# Draft. Not flashed on a B2A24S15P-CAN.
#
# Reads the GPS/UART socket at 115200 8N1 with the syssi/esphome-jk-bms
# component. Reported on JK-B2A24S15P hardware 6.x through 10.x. This is the
# path that returns all 24 cell voltages. The CAN drafts do not.
#
# P8 on the common JK-B2AxxS-15P header, left to right:
#   1 GND -> ESP32 GND
#   2 RX  -> ESP32 GPIO16 (ESP TX)
#   3 TX  -> ESP32 GPIO17 (ESP RX)
#   4 VGPS is pack voltage. Leave it open.
# Cross the data wires. Confirm pin 1 is ground with a meter before power is
# applied: some other JK boards reverse this socket.
# Set the BMS GPS/UART protocol to the UART/RS485 data mode, not a GPS modem.
# Wiring: docs/figures/uart-gps.svg

substitutions:
  name: b2a24s15p-uart
  tx_pin: GPIO16
  rx_pin: GPIO17

esphome:
  name: ${name}
  friendly_name: B2A24S15P UART
  min_version: "2026.1.0"
  comment: "Draft reader for the JK-B2A24S15P GPS/UART port"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 1d

uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

jk_modbus:
  - id: modbus0
    uart_id: uart_0

jk_bms:
  - id: bms0
    jk_modbus_id: modbus0
    update_interval: 5s

binary_sensor:
  - platform: jk_bms
    jk_bms_id: bms0
    balancing:
      name: Balancing
    charging:
      name: Charging
    discharging:
      name: Discharging
    online_status:
      name: Online

sensor:
  - platform: jk_bms
    jk_bms_id: bms0
    total_voltage:
      name: Pack voltage
    current:
      name: Pack current
    power:
      name: Pack power
    state_of_charge:
      name: State of charge
    capacity_remaining:
      name: Capacity remaining
    min_cell_voltage:
      name: Min cell voltage
    max_cell_voltage:
      name: Max cell voltage
    delta_cell_voltage:
      name: Cell delta
    average_cell_voltage:
      name: Average cell voltage
    min_voltage_cell:
      name: Min cell
    max_voltage_cell:
      name: Max cell
    mosfet_temperature:
      name: MOSFET temperature
    temperature_sensor_1:
      name: Temperature 1
    temperature_sensor_2:
      name: Temperature 2
    errors_bitmask:
      name: Error bitmask
    cell_voltage_1:
      name: "Cell 1 voltage"
    cell_voltage_2:
      name: "Cell 2 voltage"
    cell_voltage_3:
      name: "Cell 3 voltage"
    cell_voltage_4:
      name: "Cell 4 voltage"
    cell_voltage_5:
      name: "Cell 5 voltage"
    cell_voltage_6:
      name: "Cell 6 voltage"
    cell_voltage_7:
      name: "Cell 7 voltage"
    cell_voltage_8:
      name: "Cell 8 voltage"
    cell_voltage_9:
      name: "Cell 9 voltage"
